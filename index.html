<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз веб-қосымшасы</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --correct: #10b981;
            --wrong: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            padding: 20px;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 40px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
        }

        .card-num {
            background: var(--accent-blue);
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 20px;
        }

        .hidden { display: none; }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .timer-box {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-blue);
            padding: 10px 20px;
            border-radius: 12px;
            color: var(--accent-blue);
            font-weight: bold;
        }

        .question-container {
            background: #1e253a;
            padding: 40px;
            border-radius: 24px;
            margin-bottom: 25px;
            font-size: 1.4rem;
            line-height: 1.5;
            border: 1px solid var(--border);
        }

        .answer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .ans-btn {
            background: var(--card-bg);
            border: 2px solid #334155;
            color: var(--text-main);
            padding: 22px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            text-align: left;
            transition: 0.2s;
        }

        .ans-btn:hover:not(:disabled) {
            border-color: var(--accent-blue);
        }

        .correct { border-color: var(--correct) !important; background: rgba(16, 185, 129, 0.1) !important; color: var(--correct); font-weight: bold; }
        .wrong { border-color: var(--wrong) !important; background: rgba(239, 68, 68, 0.1) !important; color: var(--wrong); }
    </style>
</head>

            { q: "272. Choose the right variant. He is sleepy. He _____ drink a coffee", a: ["Should", "Cry", "Can’t be", "Hadn’t to"], c: "Should" },
            { q: "273. Choose the right variant", a: ["Paris is the most beautiful city in Europe", "Paris is the tallest city in Europe", "Paris is the more beautiful city in Europe", "Paris is the most beautifully city in Europe"], c: "Paris is the most beautiful city in Europe" },
            { q: "274. Choose the right variant. My sister thinks she's ____________ than me, but I don't agree!", a: ["More intelligent", "Intelligent", "An intelligent", "Not intelligent"], c: "More intelligent" },
            { q: "275. Choose the right variant. Your aunt’s and uncle’s children are ______", a: ["cousins", "nephews", "nieces", "twins"], c: "cousins" },
            { q: "276. Choose the right variant. I think it_______ rain", a: ["is going to", "to go", "goes to", "have been going"], c: "is going to" },
            { q: "277. Choose the right variant. You _________ lose a bit of weight. You’re getting fatter", a: ["should", "could to", "may to", "shouldn’t"], c: "should" },
            { q: "278. Choose the right variant. He fell _____and hurt his leg", a: ["down", "up", "on", "in"], c: "down" },
            { q: "279. Choose the right variant. Holiday which is celebrated on the 22nd of March", a: ["Nauryz", "Women’s day", "Independence Day", "Easter day"], c: "Nauryz" },
            { q: "280. Choose the right word to form a collocation: private ______", a: ["school", "goal", "education", "language"], c: "school" },
            { q: "281. Choose the right variant. Give the form of male ‘niece’", a: ["nephew", "grandson", "stepfather", "uncle"], c: "nephew" },
            { q: "282. Choose the right variant. Hurry up! We are going ____ late", a: ["to be", "been", "being to", "are"], c: "to be" },
            { q: "283. Choose the right variant. You _______ play computer games till midnight", a: ["shouldн’t", "ought to", "must", "should to"], c: "shouldн’t" },
            { q: "284. Choose the right variant. _______ is very bad for our health", a: ["fast food", "dairy products", "porridge", "fish"], c: "fast food" },
            { q: "285. Choose the right variant. Sue ______ to live in Italy, it’s her dream", a: ["would like", "doesn’t", "want", "would to like"], c: "would like" },
            { q: "286. Choose the right variant: Have you ….. been to a Zara store?", a: ["ever", "already", "just", "sometimes"], c: "ever" },
            { q: "287. Choose the right variant. What are the advantages of regular exercise?", a: ["It can improve cardiovascular health, increase energy levels, and enhance mood", "It can lead to a sedentary lifestyle", "It may have negative effects on mental health", "It discourages social interactions"], c: "It can improve cardiovascular health, increase energy levels, and enhance mood" },
            { q: "288. Choose the right variant. ___ can lead to a more balanced and healthy lifestyle", a: ["Regular exercise", "Watching TV for hours", "Skipping meals regularly", "Excessive caffeine intake"], c: "Regular exercise" },
            { q: "289. Choose the right variant. You can turn the radio off. I _____ to it", a: ["am not listening", "am listening", "is not listening", "doesn’t listen"], c: "am not listening" },
            { q: "290. Choose the right variant: Find out the odd word", a: ["books", "TV shows", "cartoons", "channels"], c: "books" },
            { q: "291. Choose the right variant. I usually ________ formal clothes at work", a: ["wear", "try on", "put off", "take out"], c: "wear" },
            { q: "292. Choose the right variant. I love all kinds of ________ like milk, yoghurt, kefir and cheese", a: ["dairy products", "fast food", "vegetables", "meat products"], c: "dairy products" },
            { q: "293. Choose the right variant. I ______to work as a teacher. It’s a stressful job", a: ["wouldn't like", "wants", "would to like", "doesn’t"], c: "wouldn't like" },
            { q: "294. Choose the word with general meaning: ", a: ["jewelry", "earrings", "necklace", "ring"], c: "jewelry" },
            { q: "295. Choose the right variant. In this photo my sister ______ a white dress", a: ["is wearing", "wearing", "wear", "are wearing"], c: "is wearing" },
            { q: "296. Choose the right variant. I really think a lot of our programmes are _______", a: ["entertaining", "tasty", "patient", "heavy"], c: "entertaining" },
            { q: "297. Choose the right variant. When it’s cold I _________ my leather coat", a: ["put on", "take after", "give up", "get on"], c: "put on" },
            { q: "298. Choose the right variant. Your father‘s not very fit. He doesn’t do _____exercise", a: ["enough", "not enough", "many", "too many"], c: "enough" },
            { q: "299. Choose the right variant. _____ is the Queen’s official residence", a: ["Buckingham Palace", "Big Ben", "London eye", "Tower bridge"], c: "Buckingham Palace" },
            { q: "300. We have got new computer software in our office. I haven’t learnt how ….. it yet", a: ["to use", "to live", "to get", "to tell"], c: "to use" }
        ]
    };

    const categories = [
        { id: 1, name: "1-бөлім (001-050)", desc: "Present шақтары және грамматика." },
        { id: 2, name: "2-бөлім (051-100)", desc: "Синонимдер, лексика." },
        { id: 3, name: "3-бөлім (101-150)", desc: "Сөз тіркестері және prepositions." },
        { id: 4, name: "4-бөлім (151-200)", desc: "Салыстыру, қарама-қарсы сөздер." },
        { id: 5, name: "5-бөлім (201-250)", desc: "Тағамдар, ақша, қарым-қатынас." },
        { id: 6, name: "6-бөлім (251-300)", desc: "Грамматика, отбасы және денсаулық." }
    ];

    let currentQuestions = [];
    let qIndex = 0;
    let score = 0;
    let timerId = null;
    let timeLeft = 60;

    const catGrid = document.getElementById('cat-grid');
    categories.forEach(cat => {
        catGrid.innerHTML += `
            <div class="card" onclick="startQuiz(${cat.id})">
                <div class="card-num">${cat.id}</div>
                <h3>${cat.name}</h3>
                <p style="color: #8b95b3; font-size: 0.9rem;">${cat.desc}</p>
            </div>
        `;
    });

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startTimer() {
        clearInterval(timerId);
        timeLeft = 60;
        document.getElementById('timer-val').innerText = timeLeft;
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-val').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerId);
                nextQuestion();
            }
        }, 1000);
    }

    function startQuiz(id) {
        const data = questionsDB[id] || [];
        if(data.length === 0) { alert("Бұл бөлімде сұрақ жоқ!"); return; }
        currentQuestions = shuffle([...data]);
        qIndex = 0; score = 0;
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('cat-label').innerText = `САНАТ: ${categories[id-1].name}`;
        showQuestion();
    }

    function showQuestion() {
        const qData = currentQuestions[qIndex];
        document.getElementById('q-text').innerText = qData.q;
        document.getElementById('q-progress').innerText = `Сұрақ ${qIndex + 1} / ${currentQuestions.length}`;
        const ansGrid = document.getElementById('ans-grid');
        ansGrid.innerHTML = '';
        const shuffledAnswers = shuffle([...qData.a]);
        shuffledAnswers.forEach(ans => {
            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.innerText = ans;
            btn.onclick = () => checkAnswer(btn, qData.c);
            ansGrid.appendChild(btn);
        });
        startTimer();
    }

    function checkAnswer(btn, correct) {
        clearInterval(timerId);
        const buttons = document.querySelectorAll('.ans-btn');
        buttons.forEach(b => {
            b.disabled = true;
            if(b.innerText === correct) b.classList.add('correct');
        });

        if(btn.innerText !== correct) {
            btn.classList.add('wrong');
        } else {
            score++;
        }
        setTimeout(nextQuestion, 1500);
    }

    function nextQuestion() {
        qIndex++;
        if(qIndex < currentQuestions.length) {
            showQuestion();
        } else {
            alert(`Аяқталды! Ұпай: ${score} / ${currentQuestions.length}`);
            location.reload();
        }
    }
</script>
